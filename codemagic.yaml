workflows:
  android-release:
    name: Aura Agent - Android Build (APK & AAB)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Set up Environment & Gradle Wrapper
        script: |
          echo "Preparing environment..."
          # إعداد ملف البيئة إذا لم يكن موجوداً
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # توليد gradlew وتعيين صلاحيات التنفيذ
          gradle wrapper
          chmod +x gradlew
      - name: Build Android APK (Debug / Test)
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Build Android Release (APK & AAB)
        script: |
          ./gradlew assembleRelease --no-daemon --stacktrace || true
          ./gradlew bundleRelease --no-daemon --stacktrace || true
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - surkstrr@gmail.com
        notify:
          failure: true
          success: true
